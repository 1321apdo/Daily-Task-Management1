name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: 1. تنزيل الكود (Checkout Code)
      uses: actions/checkout@v4

    - name: 2. إعداد بيئة جافا (Set up JDK 21)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 3. إعداد بيئة أندرويد (Set up Android SDK)
      uses: android-actions/setup-android@v3

    - name: 4. قبول تراخيص Android SDK
      run: |
        yes | sdkmanager --licenses || true

    - name: 5. تهيئة نظام Gradle (9.3.1)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1

    - name: 6. تجهيز مفتاح التوقيع وتوليد مشغل البناء
      run: |
        echo "=== فحص وتوليد مفتاح debug.keystore للتوقيع ==="
        if [ ! -f "debug.keystore" ]; then
          echo "إنشاء debug.keystore تلقائياً لتوقيع حزمة الـ APK..."
          keytool -genkeypair -v -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

        echo "=== تجهيز ملف تشغيل Gradle ==="
        gradle wrapper --gradle-version 9.3.1 --distribution-type bin
        chmod +x gradlew

    - name: 7. بناء حزمة التطبيق (Build APK)
      run: |
        ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

    - name: 8. رفع ملف الـ APK النهائي للتحميل المباشر
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
        retention-days: 14
