name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.10.2

    - name: Initialize Gradle Wrapper if Missing
      run: |
        if [ ! -f ./gradlew ]; then
          echo "Gradlew not found. Generating a new wrapper..."
          gradle wrapper --gradle-version 8.10.2
        fi
        chmod +x gradlew

    - name: Build Debug APK (Force Build)
      run: ./gradlew assembleDebug -Dorg.gradle.project.android.suppressVersionCheck=true --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
