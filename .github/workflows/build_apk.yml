name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. استنساخ المستودع (Checkout Repository)
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة جافا (Set up JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 3. إعداد بيئة أندرويد وقبول التراخيص (Android SDK Setup)
        uses: android-actions/setup-android@v3

      - name: 4. قبول تراخيص Android SDK تلقائياً
        run: |
          yes | sdkmanager --licenses || true

      - name: 5. البحث الذكي عن مشغل Gradle أو gradlew
        run: |
          echo "=== فحص ملفات البناء Gradle ==="
          GRADLE_RUNNER=""

          # التحقق من وجود gradlew في المجلد الرئيسي
          if [ -f "./gradlew" ]; then
            echo "✓ تم العثور على gradlew في المجلد الرئيسي."
            chmod +x ./gradlew
            GRADLE_RUNNER="./gradlew"
          else
            # البحث التلقائي في المجلدات الفرعية
            FOUND_GRADLEW=$(find . -maxdepth 3 -name "gradlew" -type f | head -n 1)
            if [ -n "$FOUND_GRADLEW" ]; then
              echo "✓ تم العثور على gradlew داخل مجلد فرعي: $FOUND_GRADLEW"
              chmod +x "$FOUND_GRADLEW"
              GRADLE_RUNNER="$FOUND_GRADLEW"
            else
              # الاعتماد على gradle المثبت في بيئة سير العمل
              echo "ℹ لم يتم العثور على gradlew، سيتم استخدام أمر gradle العام للنظام."
              GRADLE_RUNNER="gradle"
            fi
          fi

          echo "GRADLE_RUNNER=$GRADLE_RUNNER" >> $GITHUB_ENV
          echo "المشغل الذي تم اعتماده: $GRADLE_RUNNER"

      - name: 6. بناء حزمة التطبيق (Build Debug APK)
        run: |
          $GRADLE_RUNNER assembleDebug --no-daemon --stacktrace

      - name: 7. رفع حزمة APK كملف جاهز للتحميل (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DailyTaskManagement-App-Debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
